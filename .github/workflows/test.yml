name: Test monitor

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run monitor
        run: python monitor.py

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshot
          path: site.png
          if-no-files-found: ignore

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: diagnostics.txt
          if-no-files-found: ignore

      - name: Upload search result screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-result-screenshot
          path: search-result.png
          if-no-files-found: ignore

      - name: Upload search result text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-result-text
          path: search-result.txt
          if-no-files-found: ignore

      - name: Upload search result HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-result-html
          path: search-result.html
          if-no-files-found: ignore
